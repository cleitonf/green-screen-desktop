<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativação - Green Screen Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .activation-container {
            max-width: 500px;
            width: 90%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #a8e6cf);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            font-size: 14px;
            opacity: 0.8;
        }

        .activation-form {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: normal;
        }

        input:focus {
            outline: none;
            border-color: #2ecc71;
            background: rgba(255, 255, 255, 0.15);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
            display: block;
        }

        .message.error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            display: block;
        }

        .message.info {
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid #3498db;
            color: #3498db;
            display: block;
        }

        .info-box {
            background: rgba(52, 152, 219, 0.1);
            border: 1px solid rgba(52, 152, 219, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
        }

        .info-box strong {
            color: #3498db;
            display: block;
            margin-bottom: 8px;
        }

        .info-box ul {
            list-style: none;
            padding-left: 0;
        }

        .info-box li {
            padding: 4px 0;
            padding-left: 20px;
            position: relative;
        }

        .info-box li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #2ecc71;
            font-weight: bold;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #2ecc71;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .hardware-id {
            font-family: monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .links a {
            color: #3498db;
            text-decoration: none;
            margin: 0 10px;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="activation-container">
        <div class="logo">
            <h1>🎬 Green Screen Studio</h1>
            <p>Versão 1.0.0</p>
        </div>

        <div id="messageBox" class="message"></div>

        <div class="loading" id="loadingBox">
            <div class="spinner"></div>
            <span>Validando licença...</span>
        </div>

        <form class="activation-form" id="activationForm">
            <div class="form-group">
                <label for="licenseKey">🔑 Chave de Ativação</label>
                <input 
                    type="text" 
                    id="licenseKey" 
                    placeholder="XXXX-XXXX-XXXX-XXXX"
                    maxlength="19"
                    autocomplete="off"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary" id="activateBtn">
                🚀 Ativar Software
            </button>

            <button type="button" class="btn btn-secondary" id="buyBtn">
                🛒 Comprar Licença
            </button>
        </form>

        <div class="info-box">
            <strong>📋 Como ativar:</strong>
            <ul>
                <li>Adquira sua chave de licença</li>
                <li>Cole a chave no campo acima</li>
                <li>Clique em "Ativar Software"</li>
                <li>A licença fica vinculada a este computador</li>
            </ul>
        </div>

        <div class="links">
            <a href="#" id="supportLink">Suporte</a> | 
            <a href="#" id="faqLink">FAQ</a>
        </div>

        <div class="hardware-id" id="hardwareIdDisplay">
            Hardware ID: Carregando...
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        let hardwareId = '';

        // Carregar Hardware ID ao iniciar
        async function loadHardwareId() {
            try {
                hardwareId = await ipcRenderer.invoke('get-hardware-id');
                document.getElementById('hardwareIdDisplay').textContent = 
                    `Hardware ID: ${hardwareId.substring(0, 16)}...`;
            } catch (error) {
                console.error('Erro ao carregar Hardware ID:', error);
            }
        }

        // Formatar chave automaticamente (XXXX-XXXX-XXXX-XXXX)
        const licenseInput = document.getElementById('licenseKey');
        licenseInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/[^A-Z0-9]/g, '').toUpperCase();
            let formatted = '';
            
            for (let i = 0; i < value.length && i < 16; i++) {
                if (i > 0 && i % 4 === 0) {
                    formatted += '-';
                }
                formatted += value[i];
            }
            
            e.target.value = formatted;
        });

        // Formulário de ativação
        document.getElementById('activationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const licenseKey = licenseInput.value.trim();
            
            if (licenseKey.length !== 19) {
                showMessage('error', '❌ Chave inválida. Use o formato: XXXX-XXXX-XXXX-XXXX');
                return;
            }

            // Desabilitar botão e mostrar loading
            const activateBtn = document.getElementById('activateBtn');
            activateBtn.disabled = true;
            activateBtn.textContent = 'Ativando...';
            showLoading(true);

            try {
                // Enviar para processo principal do Electron
                const result = await ipcRenderer.invoke('activate-license', licenseKey);
                
                if (result.success) {
                    showMessage('success', '✅ ' + result.message);
                    
                    // Aguardar 2 segundos e fechar janela de ativação
                    setTimeout(() => {
                        ipcRenderer.send('activation-complete');
                    }, 2000);
                } else {
                    showMessage('error', '❌ ' + result.error);
                    activateBtn.disabled = false;
                    activateBtn.textContent = '🚀 Ativar Software';
                }
            } catch (error) {
                showMessage('error', '❌ Erro ao ativar: ' + error.message);
                activateBtn.disabled = false;
                activateBtn.textContent = '🚀 Ativar Software';
            } finally {
                showLoading(false);
            }
        });

        // Botão de comprar
        document.getElementById('buyBtn').addEventListener('click', () => {
            ipcRenderer.send('open-purchase-page');
        });

        // Links de suporte
        document.getElementById('supportLink').addEventListener('click', (e) => {
            e.preventDefault();
            ipcRenderer.send('open-support');
        });

        document.getElementById('faqLink').addEventListener('click', (e) => {
            e.preventDefault();
            ipcRenderer.send('open-faq');
        });

        // Funções auxiliares
        function showMessage(type, text) {
            const messageBox = document.getElementById('messageBox');
            messageBox.className = `message ${type}`;
            messageBox.textContent = text;
        }

        function showLoading(show) {
            const loadingBox = document.getElementById('loadingBox');
            loadingBox.className = show ? 'loading active' : 'loading';
        }

        // Inicializar
        loadHardwareId();
    </script>
</body>
</html>
